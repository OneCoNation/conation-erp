providers = ["php"]

[phases.setup]
nixPkgs = [
    "php83", 
    "php83Extensions.mysqli", 
    "php83Extensions.pdo_mysql", 
    "php83Extensions.gd", 
    "php83Extensions.intl", 
    "php83Extensions.curl", 
    "php83Extensions.zip", 
    "php83Extensions.mbstring", 
    "php83Extensions.imap", 
    "php83Extensions.xml",      # Penting untuk Dolibarr API/Import
    "php83Extensions.soap",     # Penting untuk Web Services
    "php83Extensions.calendar", # Penting untuk modul Agenda
    "nginx", 
    "libmysqlclient", 
    "nodejs_18"
]
nixLibs = ["libmysqlclient"]

[phases.install]
cmds = [
    # Membuat folder log Nginx
    "mkdir -p /var/log/nginx",
    "mkdir -p /var/cache/nginx",
    
    # Membuat folder dokumen & File Kunci (PENTING!)
    "mkdir -p /app/documents",
    "touch /app/documents/install.lock",
    
    # Memberikan izin tulis penuh ke folder dokumen
    "chmod -R 777 /app/documents",
    
    # Memberikan izin eksekusi ke script start (jika ada)
    "chmod +x /app/start.sh"
]

[variables]
NIXPACKS_PHP_ROOT_DIR = "htdocs"
NIXPACKS_PHP_FALLBACK_VERSION = "8.3"

[start]
cmd = "bash /app/start.sh"