# File: nixpacks.toml
# Final Configuration for Dolibarr on Railway
# Optimized by Gemini

providers = ["php"]

[phases.setup]
nixPkgs = [
    "php83", 
    "php83Extensions.mysqli", 
    "php83Extensions.pdo_mysql", 
    "php83Extensions.gd", 
    "php83Extensions.intl", 
    "php83Extensions.curl", 
    "php83Extensions.zip", 
    "php83Extensions.mbstring", 
    "php83Extensions.imap", 
    "php83Extensions.xml",      # Wajib untuk API & Import/Export
    "php83Extensions.soap",     # Wajib untuk Web Services
    "php83Extensions.calendar", # Wajib untuk Modul Agenda
    "nginx", 
    "libmysqlclient", 
    "nodejs_18"
]
nixLibs = ["libmysqlclient"]

[phases.install]
cmds = [
    # 1. Buat folder Log Nginx agar tidak error saat start
    "mkdir -p /var/log/nginx",
    "mkdir -p /var/cache/nginx",
    
    # 2. Buat folder Dokumen (Titik Mount Volume)
    "mkdir -p /app/documents",
    
    # 3. Buat file install.lock (Untuk jaga-jaga jika Volume belum di-mount)
    "touch /app/documents/install.lock",
    
    # 4. Berikan izin FULL (Read/Write) ke folder dokumen agar bisa upload logo/faktur
    "chmod -R 777 /app/documents"
]

[variables]
# Memberitahu Nixpacks bahwa kode utama ada di folder htdocs
NIXPACKS_PHP_ROOT_DIR = "htdocs"
NIXPACKS_PHP_FALLBACK_VERSION = "8.3"

# CATATAN: Bagian [start] DIHAPUS agar menggunakan default Nginx dari Nixpacks.
# Ini jauh lebih stabil dan minim error 502 Bad Gateway.