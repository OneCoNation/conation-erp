providers = ["php"]

[phases.setup]
nixPkgs = ["php83", "nginx", "libmysqlclient", "nodejs_18"]
nixLibs = ["libmysqlclient"]

[phases.install]
cmds = ["mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx"]

[variables]
NIXPACKS_PHP_ROOT_DIR = "htdocs"
NIXPACKS_PHP_FALLBACK_VERSION = "8.3"

[start]
cmd = "php -S 0.0.0.0:${PORT} -t htdocs"
