providers = ["php"]

[phases.setup]
nixPkgs = ["php83", "php83Extensions.mysqli", "php83Extensions.pdo_mysql", "php83Extensions.gd", "php83Extensions.intl", "php83Extensions.curl", "php83Extensions.zip", "php83Extensions.mbstring", "php83Extensions.imap", "nginx", "libmysqlclient", "nodejs_18"]
nixLibs = ["libmysqlclient"]

[phases.install]
cmds = ["mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx && mkdir -p /app/documents && chmod +x /app/start.sh"]

[variables]
NIXPACKS_PHP_ROOT_DIR = "htdocs"
NIXPACKS_PHP_FALLBACK_VERSION = "8.3"

[start]
cmd = "bash /app/start.sh"